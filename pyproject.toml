[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfoliox"
version = "0.1.0"
description = "A layered portfolio-trading backend with a framework-free domain core."
requires-python = ">=3.10"
readme = "README.md"

# Dependencies live in requirements.txt for now so CI stays simple.
# Once CI is green, move them here and delete requirements.txt.

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # No `types-python-dotenv` needed: the library ships a py.typed marker,
    # so type checkers read its annotations directly.
]

# ==============================================================================
# Ruff — linting + formatting
# ==============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"
# Keep generated / vendored paths out of linting entirely
extend-exclude = [".venv", "venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
# E  = pycodestyle style errors
# F  = pyflakes  (undefined names, unused imports) -> catches real bugs
# I  = isort     (import sorting)
# B  = bugbear   (mutable default args, shadowing, etc.)
# UP = pyupgrade (modern Python syntax, e.g. `Optional[X]` -> `X | None`)
# SIM= simplify  (collapses `if x: return True else: return False`)
select = ["E", "F", "I", "B", "UP", "SIM"]

# E501 is line length — `ruff format` owns that now, so don't double-report it.
ignore = [
    "E501",
    # SQLAlchemy declarative models legitimately shadow builtins
    # (`id`, `metadata`) and use dynamic class attributes.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to be loose: long asserts, magic values, unused fixtures.
"tests/**" = ["E501", "B011", "SIM117"]
# Alembic migrations are generated code — don't fight it.
"alembic/**" = ["E501", "F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ==============================================================================
# Mypy — static type checking
# ==============================================================================
[tool.mypy]
python_version = "3.10"
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Report `Any` leaking out of a function whose return type is known.
# This is what catches `-> AccountModel` that actually returns None.
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true

# Catch obvious mistakes: `Decimal(str(x))` vs `Decimal(x)` misuse,
# unreachable branches, etc.
warn_unreachable = true
strict_equality = true

# Deliberately OFF at the top level so you can adopt this incrementally.
# Turn it on once your annotations are complete — see the override below.
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false

# Your domain layer is already fully annotated. That is your strongest
# claim, so make mypy enforce it there specifically.
[[tool.mypy.overrides]]
module = ["app.domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ---------------------------------------------------------------------------
# Per-module escape hatches, with a written reason.
#
# This is the difference between "we silenced mypy" and "we made a deliberate
# engineering trade-off". Each of these is a case where the type system's
# static limits do not match SQLAlchemy's runtime behaviour.
# ---------------------------------------------------------------------------

# Data-mapper boundary: ORM rows are dynamically typed at runtime.
[[tool.mypy.overrides]]
module = ["app.models.*"]
disallow_untyped_defs = true
disable_error_code = ["misc", "assignment"]

# Repository layer legitimately hands back ORM models and optional rows.
[[tool.mypy.overrides]]
module = ["app.repositories.*"]
disallow_untyped_defs = true
warn_return_any = false

# FastAPI dependency injection is resolved by the framework, not the type checker.
[[tool.mypy.overrides]]
module = ["app.api.*"]
disallow_untyped_defs = true
disallow_untyped_decorators = false

# Tests intentionally build partial fixtures.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

# ==============================================================================
# Pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra",                    # show reasons for skips/xfails in summary
    "--strict-markers",       # typo'd @pytest.mark.slow fails instead of warning
    "--strict-config",
]

# Needed for the Limit Order Scheduler's async tests.
asyncio_mode = "auto"